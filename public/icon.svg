    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ecff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- book shadow -->
  <path d="M512 772 C 430 724, 320 712, 214 724 L 214 342 C 320 330, 430 342, 512 390 C 594 342, 704 330, 810 342 L 810 724 C 704 712, 594 724, 512 772 Z" fill="#2e1065" opacity=".28" transform="translate(0 26)"/>
