  <path d="M512 380 C 594 330, 704 318, 810 330 L 810 712 C 704 700, 594 712, 512 762 Z" fill="url(#pageR)"/>
  <path d="M512 380 L 512 762" stroke="#c4b5fd" stroke-width="6"/>
