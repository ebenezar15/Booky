# Builds the installable desktop apps on real Windows and macOS machines.
#  - Every push: installers are attached to the workflow run (Actions → this run → Artifacts).
#  - Pushing a tag like v1.0.0: they are also published as a GitHub Release.
name: Desktop apps

on:
  push:
    branches: [main, claude/sleepy-tesla-l6eefn]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              release/desktop/*.exe
          - os: macos-latest
            target: --mac
            files: |
              release/desktop/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Booky-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
