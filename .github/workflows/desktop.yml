# Builds the installable desktop apps on real Windows and macOS machines.
#  - Every push: installers are attached to the workflow run and published on the Releases
#    page as "Booky <version>" (the version comes from package.json).
name: Desktop apps

on:
  push:
    branches: [main, claude/sleepy-tesla-l6eefn]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              release/desktop/*.exe
          - os: macos-latest
            target: --mac
            files: |
              release/desktop/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Booky-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Publish (or refresh) the Releases page so there is always a simple download link.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Booky ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ matrix.files }}
          body: |
            **Windows:** download `Booky-Setup-${{ steps.version.outputs.v }}.exe` (installer) or the `portable` .exe.
            **Mac:** `Booky-${{ steps.version.outputs.v }}-mac-arm64.dmg` for Apple Silicon (M1–M4), `…-mac-x64.dmg` for Intel Macs.
            First launch: Windows → “More info” → “Run anyway”. Mac → System Settings → Privacy & Security → “Open Anyway”.
            Prefer no install? Use Booky in your browser: https://ebenezar15.github.io/Booky/
